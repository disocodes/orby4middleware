[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orby4middleware"
version = "0.2.0"
description = "Vendor-neutral medical device and modality interoperability gateway"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "orby4middleware contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "pyserial>=3.5,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
orby4middleware = "orby4middleware.cli:main"
orby4-edge = "orby4middleware.edge.cli:main"

[project.entry-points."orby4middleware.protocols"]
# Third-party packages can register protocol adapters here.

[tool.hatch.build.targets.wheel]
packages = ["src/orby4middleware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
