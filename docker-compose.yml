services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orby
      POSTGRES_USER: orby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orby-change-me}
    volumes:
      - orby_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orby -d orby"]
      interval: 5s
      timeout: 5s
      retries: 20

  orby:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORBY_DATABASE_URL: postgresql+psycopg://orby:${POSTGRES_PASSWORD:-orby-change-me}@postgres:5432/orby
      ORBY_API_KEY: ${ORBY_API_KEY:-change-me-before-production}
      ORBY_RAW_RETENTION_ENABLED: ${ORBY_RAW_RETENTION_ENABLED:-true}
    ports:
      - "8080:8080"

  orthanc:
    profiles: ["imaging"]
    image: orthancteam/orthanc:latest
    environment:
      ORTHANC__NAME: orby-orthanc
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USERNAME:-orthanc}":"${ORTHANC_PASSWORD:-change-me}"}'
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - orthanc_data:/var/lib/orthanc/db

  hapi-fhir:
    profiles: ["fhir"]
    image: hapiproject/hapi:latest
    ports:
      - "8081:8080"

volumes:
  orby_pg:
  orthanc_data:
